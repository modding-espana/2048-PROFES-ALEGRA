<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Own 2048 Game</title>
    <style>
        body {
            background-color: #faf8ef;
            color: #776e65;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 60px; margin: 0; }
        .score-container {
            background: #bbada0;
            padding: 10px 20px;
            font-size: 25px;
            font-weight: bold;
            color: white;
            border-radius: 3px;
            margin-bottom: 20px;
        }
        #game-container {
            width: 400px;
            height: 400px;
            background-color: #bbada0;
            border-radius: 6px;
            position: relative;
            padding: 15px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
            width: 100%;
            height: 100%;
        }
        .cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            width: 100%;
            height: 100%;
        }
        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease-in-out;
        }
        /* Tile Colors */
        .t2 { background: #eee4da; color: #776e65; }
        .t4 { background: #ede0c8; color: #776e65; }
        .t8 { background: #f2b179; color: #f9f6f2; }
        .t16 { background: #f59563; color: #f9f6f2; }
        .t32 { background: #f67c5f; color: #f9f6f2; }
        .t64 { background: #f65e3b; color: #f9f6f2; }
        .t128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
        .t256 { background: #edcc61; color: #f9f6f2; font-size: 30px; }
        .t512 { background: #edc850; color: #f9f6f2; font-size: 30px; }
        .t1024 { background: #edc53f; color: #f9f6f2; font-size: 25px; }
        .t2048 { background: #edc22e; color: #f9f6f2; font-size: 25px; }
    </style>
</head>
<body>

    <h1>2048</h1>
    <div class="score-container">Score: <span id="score">0</span></div>

    <div id="game-container">
        <div class="grid">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div id="tiles-container"></div>
    </div>

    <script>
        const boardSize = 4;
        let board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
        let score = 0;

        function init() {
            addRandomTile();
            addRandomTile();
            draw();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if (emptyCells.length > 0) {
                let {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function draw() {
            const container = document.getElementById('tiles-container');
            container.innerHTML = '';
            document.getElementById('score').innerText = score;

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] !== 0) {
                        let tile = document.createElement('div');
                        tile.classList.add('tile', 't' + board[r][c]);
                        tile.innerText = board[r][c];
                        // Calculate positions dynamically for the 400x400 box
                        tile.style.top = (15 + r * 95) + 'px';
                        tile.style.left = (15 + c * 95) + 'px';
                        container.appendChild(tile);
                    }
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(val => val);
            while (arr.length < boardSize) arr.push(0);
            return arr;
        }

        function rotate() {
            board = board[0].map((val, index) => board.map(row => row[index]).reverse());
        }

        function move(direction) {
            let moved = false;
            // 0: Left, 1: Down, 2: Right, 3: Up
            for (let i = 0; i < direction; i++) rotate();

            for (let r = 0; r < boardSize; r++) {
                let oldRow = [...board[r]];
                board[r] = slide(board[r]);
                if (oldRow.toString() !== board[r].toString()) moved = true;
            }

            for (let i = 0; i < (4 - direction) % 4; i++) rotate();

            if (moved) {
                addRandomTile();
                draw();
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move(0);
            if (e.key === 'ArrowDown') move(1);
            if (e.key === 'ArrowRight') move(2);
            if (e.key === 'ArrowUp') move(3);
        });

        init();
    </script>
</body>
</html>
